<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Игра с Firebase</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0f1117;
            color: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #181b24;
            border: 1px solid #2d3748;
            padding: 30px;
            border-radius: 12px;
            width: 300px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            background: #0b0d12;
            border: 1px solid #2d3748;
            border-radius: 6px;
            color: white;
            outline: none;
        }
        input:focus {
            border-color: #6366f1;
        }
        button {
            width: 100%;
            padding: 10px;
            background: #6366f1;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            margin-top: 5px;
            transition: background 0.2s;
        }
        button:hover {
            background: #4f46e5;
        }
        .secondary-btn {
            background: transparent;
            border: 1px solid #2d3748;
            color: #9ca3af;
            margin-top: 8px;
        }
        .secondary-btn:hover {
            background: rgba(255,255,255,0.05);
            color: white;
        }
        .error {
            color: #ef4444;
            font-size: 13px;
            margin-top: 10px;
        }
        .success {
            color: #10b981;
            font-size: 13px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <!-- ЭКРАН ВХОДА / РЕГИСТРАЦИИ -->
    <div class="card" id="auth-screen">
        <h2 id="form-title">Вход</h2>
        <input type="email" id="email" placeholder="Email">
        <input type="password" id="password" placeholder="Пароль">
        <button id="main-btn" onclick="handleAuth()">Войти</button>
        <button class="secondary-btn" onclick="toggleMode()">Создать аккаунт</button>
        <div id="error-msg" class="error"></div>
    </div>

    <!-- ИГРОВОЙ ЭКРАН -->
    <div class="card" id="game-screen" style="display: none;">
        <h2>Угадай число</h2>
        <p>Привет, <span id="user-email"></span>!</p>
        <p>Я загадал число от 1 до 10.</p>
        <input type="number" id="guess-input" placeholder="Твое число" min="1" max="10">
        <button onclick="checkGuess()">Проверить</button>
        <div id="game-msg" class="success"></div>
        <button class="secondary-btn" onclick="logout()">Выйти</button>
    </div>

    <!-- Подключаем Firebase и твой конфиг -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getAuth, 
            createUserWithEmailAndPassword, 
            signInWithEmailAndPassword, 
            signOut, 
            onAuthStateChanged 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // Твой конфиг Firebase уже на месте:
        const firebaseConfig = {
            apiKey: "AIzaSyDboivRYj3eu7abGFFo5Lm4MkqRgD0WEVA",
            authDomain: "planning-with-ai-6c81a.firebaseapp.com",
            projectId: "planning-with-ai-6c81a",
            storageBucket: "planning-with-ai-6c81a.firebasestorage.app",
            messagingSenderId: "81967264804",
            appId: "1:81967264804:web:fe8e8f02ad36e3841754b1"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        let isRegistering = false;
        let secretNumber = Math.floor(Math.random() * 10) + 1;

        window.toggleMode = function() {
            isRegistering = !isRegistering;
            document.getElementById('form-title').innerText = isRegistering ? 'Регистрация' : 'Вход';
            document.getElementById('main-btn').innerText = isRegistering ? 'Зарегистрироваться' : 'Войти';
            document.querySelector('.secondary-btn').innerText = isRegistering ? 'Есть аккаунт? Войти' : 'Создать аккаунт';
            document.getElementById('error-msg').innerText = '';
        }

        window.handleAuth = async function() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorEl = document.getElementById('error-msg');

            try {
                if (isRegistering) {
                    await createUserWithEmailAndPassword(auth, email, password);
                } else {
                    await signInWithEmailAndPassword(auth, email, password);
                }
            } catch (error) {
                errorEl.innerText = 'Ошибка: ' + error.message;
            }
        }

        window.logout = async function() {
            await signOut(auth);
        }

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('game-screen').style.display = 'block';
                document.getElementById('user-email').innerText = user.email;
            } else {
                document.getElementById('game-screen').style.display = 'none';
                document.getElementById('auth-screen').style.display = 'block';
                document.getElementById('email').value = '';
                document.getElementById('password').value = '';
            }
        });

        window.checkGuess = function() {
            const guess = Number(document.getElementById('guess-input').value);
            const msg = document.getElementById('game-msg');

            if (!guess) {
                msg.className = 'error';
                msg.innerText = 'Введи число!';
                return;
            }

            if (guess === secretNumber) {
                msg.className = 'success';
                msg.innerText = '🎉 Победа! Загадано новое число.';
                secretNumber = Math.floor(Math.random() * 10) + 1;
            } else if (guess < secretNumber) {
                msg.className = 'error';
                msg.innerText = 'Мое число больше 📈';
            } else {
                msg.className = 'error';
                msg.innerText = 'Мое число меньше 📉';
            }
        }
    </script>
</body>
</html>
