<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Простой Кликер с Авторизацией</title>
<style>
  :root {
    --bg: #0f1117;
    --card: #181b24;
    --accent: #6366f1;
    --accent-hover: #4f46e5;
    --text: #f3f4f6;
    --muted: #9ca3af;
    --border: #2d3748;
    --success: #10b981;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
  body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  
  .container { width: 100%; max-width: 400px; padding: 20px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
  
  h2 { font-size: 24px; font-weight: 700; margin-bottom: 6px; text-align: center; }
  .subtitle { font-size: 14px; color: var(--muted); text-align: center; margin-bottom: 24px; }
  
  .form-group { margin-bottom: 16px; }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
  input { width: 100%; background: #0b0d12; border: 1px solid var(--border); border-radius: 8px; padding: 12px; color: var(--text); font-size: 14px; outline: none; transition: border-color 0.2s; }
  input:focus { border-color: var(--accent); }
  
  .btn { width: 100%; background: var(--accent); color: white; border: none; border-radius: 8px; padding: 12px; font-size: 14px; font-weight: 600; cursor: pointer; transition: background 0.2s, transform 0.1s; margin-top: 8px; }
  .btn:hover { background: var(--accent-hover); }
  .btn:active { transform: scale(0.98); }
  .btn-secondary { background: transparent; border: 1px solid var(--border); color: var(--muted); margin-top: 8px; }
  .btn-secondary:hover { background: rgba(255,255,255,0.05); color: var(--text); }
  
  .error { color: #ef4444; font-size: 13px; text-align: center; margin-top: 12px; min-height: 18px; }
  
  /* Игровой интерфейс */
  .game-screen { display: none; width: 100%; max-width: 480px; padding: 20px; }
  .game-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: var(--card); border: 1px solid var(--border); padding: 14px 18px; border-radius: 12px; }
  .user-info { font-weight: 600; font-size: 15px; }
  .score-board { font-size: 28px; font-weight: 800; text-align: center; margin: 30px 0; color: var(--success); }
  .clicker-btn { width: 160px; height: 160px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), #a855f7); border: none; color: white; font-size: 22px; font-weight: bold; cursor: pointer; display: block; margin: 0 auto 30px; box-shadow: 0 10px 25px rgba(99,102,241,0.4); transition: transform 0.1s; }
  .clicker-btn:active { transform: scale(0.92); }
  
  .upgrades { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
  .upgrade-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .upgrade-item:last-child { border-bottom: none; }
  .upgrade-title { font-size: 14px; font-weight: 500; }
  .upgrade-sub { font-size: 12px; color: var(--muted); }
  .buy-btn { background: rgba(99,102,241,0.2); border: 1px solid var(--accent); color: var(--text); padding: 6px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; font-weight: 600; }
  .buy-btn:hover { background: var(--accent); }
</style>
</head>
<body>

  <!-- ЭКРАН АВТОРИЗАЦИИ / РЕГИСТРАЦИИ -->
  <div class="container" id="auth-container">
    <div class="card">
      <h2 id="form-title">Вход</h2>
      <div class="subtitle" id="form-subtitle">Введите свои данные для игры</div>
      
      <div class="form-group" id="name-group" style="display: none;">
        <label>Имя пользователя</label>
        <input type="text" id="username" placeholder="Твой никнейм">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" placeholder="example@mail.com">
      </div>
      <div class="form-group">
        <label>Пароль</label>
        <input type="password" id="password" placeholder="••••••••">
      </div>
      
      <button class="btn" id="main-action-btn" onclick="handleAuth()">Войти</button>
      <button class="btn btn-secondary" id="switch-mode-btn" onclick="switchMode()">Нет аккаунта? Зарегистрироваться</button>
      
      <div class="error" id="error-msg"></div>
    </div>
  </div>

  <!-- ИГРОВОЙ ЭКРАН -->
  <div class="game-screen" id="game-container">
    <div class="game-header">
      <div>Игрок: <span class="user-info" id="display-user"></span></div>
      <button class="btn-secondary" style="margin:0; padding: 6px 12px; width:auto;" onclick="logout()">Выйти</button>
    </div>
    
    <div class="card">
      <div class="score-board"><span id="score">0</span> 🪙</div>
      <button class="clicker-btn" onclick="clickCoin()">Клик!</button>
      
      <div class="upgrades">
        <div style="font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 8px; text-transform: uppercase;">Улучшения</div>
        
        <div class="upgrade-item">
          <div>
            <div class="upgrade-title">Крепкий палец (+1 за клик)</div>
            <div class="upgrade-sub">Цена: <span id="p1-cost">15</span> монет</div>
          </div>
          <button class="buy-btn" onclick="buyUpgrade(1)">Купить</button>
        </div>
        
        <div class="upgrade-item">
          <div>
            <div class="upgrade-title">Авто-кликер (+1 монета/сек)</div>
            <div class="upgrade-sub">Цена: <span id="p2-cost">50</span> монет</div>
          </div>
          <button class="buy-btn" onclick="buyUpgrade(2)">Купить</button>
        </div>
      </div>
    </div>
  </div>

<script>
  let isRegistering = false;
  let currentUser = null;
  
  // Игровые переменные
  let score = 0;
  let clickPower = 1;
  let autoPower = 0;
  let cost1 = 15;
  let cost2 = 50;

  // Проверка сохраненной сессии при загрузке
  window.onload = function() {
    const savedUser = localStorage.getItem('clicker_current_user');
    if (savedUser) {
      loadGameData(savedUser);
      showGame(savedUser);
    }
  };

  function switchMode() {
    isRegistering = !isRegistering;
    document.getElementById('form-title').innerText = isRegistering ? 'Регистрация' : 'Вход';
    document.getElementById('form-subtitle').innerText = isRegistering ? 'Создайте новый аккаунт' : 'Введите свои данные для игры';
    document.getElementById('name-group').style.display = isRegistering ? 'block' : 'none';
    document.getElementById('main-action-btn').innerText = isRegistering ? 'Зарегистрироваться' : 'Войти';
    document.getElementById('switch-mode-btn').innerText = isRegistering ? 'Уже есть аккаунт? Войти' : 'Нет аккаунта? Зарегистрироваться';
    document.getElementById('error-msg').innerText = '';
  }

  function handleAuth() {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value.trim();
    const username = document.getElementById('username').value.trim();
    const errorEl = document.getElementById('error-msg');

    if (!email || !password || (isRegistering && !username)) {
      errorEl.innerText = 'Заполните все поля!';
      return;
    }

    // База данных пользователей в localStorage
    let users = JSON.parse(localStorage.getItem('clicker_users') || '{}');

    if (isRegistering) {
      if (users[email]) {
        errorEl.innerText = 'Этот email уже зарегистрирован!';
        return;
      }
      // Создаем нового пользователя
      users[email] = { username, password, score: 0, clickPower: 1, autoPower: 0, cost1: 15, cost2: 50 };
      localStorage.setItem('clicker_users', JSON.stringify(users));
      loginUser(email, username);
    } else {
      if (!users[email] || users[email].password !== password) {
        errorEl.innerText = 'Неверный email или пароль!';
        return;
      }
      loginUser(email, users[email].username);
    }
  }

  function loginUser(email, username) {
    currentUser = email;
    localStorage.setItem('clicker_current_user', email);
    loadGameData(email);
    showGame(username);
  }

  function loadGameData(email) {
    let users = JSON.parse(localStorage.getItem('clicker_users') || '{}');
    if (users[email]) {
      score = users[email].score || 0;
      clickPower = users[email].clickPower || 1;
      autoPower = users[email].autoPower || 0;
      cost1 = users[email].cost1 || 15;
      cost2 = users[email].cost2 || 50;
    }
    updateUI();
  }

  function saveGameData() {
    if (!currentUser) return;
    let users = JSON.parse(localStorage.getItem('clicker_users') || '{}');
    if (users[currentUser]) {
      users[currentUser].score = score;
      users[currentUser].clickPower = clickPower;
      users[currentUser].autoPower = autoPower;
      users[currentUser].cost1 = cost1;
      users[currentUser].cost2 = cost2;
      localStorage.setItem('clicker_users', JSON.stringify(users));
    }
  }

  function showGame(username) {
    document.getElementById('auth-container').style.display = 'none';
    document.getElementById('game-container').style.display = 'block';
    document.getElementById('display-user').innerText = username;
  }

  function logout() {
    saveGameData();
    currentUser = null;
    localStorage.removeItem('clicker_current_user');
    document.getElementById('game-container').style.display = 'none';
    document.getElementById('auth-container').style.display = 'block';
  }

  // Игровая логика
  function clickCoin() {
    score += clickPower;
    updateUI();
    saveGameData();
  }

  function buyUpgrade(type) {
    if (type === 1) {
      if (score >= cost1) {
        score -= cost1;
        clickPower += 1;
        cost1 = Math.floor(cost1 * 1.5);
      }
    } else if (type === 2) {
      if (score >= cost2) {
        score -= cost2;
        autoPower += 1;
        cost2 = Math.floor(cost2 * 1.6);
      }
    }
    updateUI();
    saveGameData();
  }

  function updateUI() {
    document.getElementById('score').innerText = score;
    document.getElementById('p1-cost').innerText = cost1;
    document.getElementById('p2-cost').innerText = cost2;
  }

  // Авто-кликер (каждую секунду)
  setInterval(() => {
    if (currentUser && autoPower > 0) {
      score += autoPower;
      updateUI();
      saveGameData();
    }
  }, 1000);
</script>

</body>
</html>
